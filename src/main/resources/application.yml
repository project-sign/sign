spring:
  application:
    name: sign
  datasource:
    url: jdbc:h2:mem:database
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul
  h2:
    console:
      enabled: true
      path: /h2-console
email-certification:
  mail-host: "sign@sign.co.kr"
  re-send-time-as-seconds: 60
  expired-time-as-seconds: 300
  max-certification-count: 3

passkey:
  relying-party:
    id: "test.sign"
    name: "sign"
    origins: "test.sign"
    handle-length: 64

protected-value:
  secret: "testSecretKeytestSecretKeytestSecretKeytestSecretKeytestSecretKey"
  footer: "sign"
  expired-time: "30s"