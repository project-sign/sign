server:
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: changeit
    key-alias: local-ssl

spring:
  config:
    import: classpath:secret/mail.yml
  application:
    name: sign
  datasource:
    url: jdbc:h2:mem:database
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul
  h2:
    console:
      enabled: true
      path: /h2-console

passkey:
  relying-party:
    id: "localhost"
    name: "sign"
    origins: "https://localhost:8080"
    handle-length: 64

protected-value:
  footer: "sign"
  expired: "30s"
  secret-key: "testSecretKeytestSecretKeytestSecretKeytestSecretKeytestSecretKey"
